name: Pubblica sito e aggiorna colonnine

on:
  push:
    branches: [main]
  schedule:
    # ogni giorno (ora UTC): mattina, mezzogiorno e pomeriggio
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:         # pulsante "Run workflow" per farlo partire a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le librerie per la PUN
        run: python -m pip install --quiet boto3 requests

      - name: Scarica le colonnine dalla PUN
        timeout-minutes: 30
        env:
          SITO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python aggiorna_colonnine.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
